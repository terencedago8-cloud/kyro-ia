# ============================================================
#  KYRO AI — Render Blueprint
#  Lu automatiquement par Render ("New +" → Blueprint).
#  Il crée : 1 service web (Python) + 1 base PostgreSQL managée.
#
#  Règle Render : les bases PostgreSQL sont déclarées au NIVEAU
#  RACINE (clé `databases`), jamais imbriquées dans un service.
# ============================================================

services:
  - type: web
    name: kyro-ai
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Render impose son propre PORT : on ne doit PAS forcer 8000.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KYRO_ENVIRONMENT
        value: production
      # Secret de signature des jetons JWT — généré aléatoirement par Render.
      - key: KYRO_JWT_SECRET
        generateValue: true
      # URL de la base PostgreSQL créée ci-dessous (propriété connectionString).
      - key: KYRO_DATABASE_URL
        fromDatabase:
          name: kyro-db
          property: connectionString
      # Restreignez à l'URL exacte du site après le 1er déploiement.
      - key: KYRO_CORS_ORIGINS
        value: "*"
      # --- Premier administrateur (créé au 1er démarrage, aucun admin existant) ---
      - key: ADMIN_EMAIL
        value: admin@kyro-ai.com
      - key: ADMIN_USERNAME
        value: admin
      # ⚠️ Mot de passe ADMIN — changez-le via `sync: false` (Render demandera
      #    une valeur au moment de la création, elle ne sera jamais dans le dépôt).
      - key: ADMIN_PASSWORD
        sync: false
      # --- Fournisseurs IA (à renseigner plus tard dans le dashboard) ---
      - key: KYRO_CHAT_API_BASE
        sync: false
      - key: KYRO_CHAT_API_KEY
        sync: false
      - key: KYRO_CHAT_MODEL
        value: gpt-4o-mini
      - key: KYRO_IMAGE_API_BASE
        sync: false
      - key: KYRO_IMAGE_API_KEY
        sync: false
      - key: KYRO_VIDEO_API_KEY
        sync: false

# Base PostgreSQL managée (déclaration de premier niveau — obligatoire)
databases:
  - name: kyro-db
    plan: free                # 0,1 CPU / 256 Mo — expire après 90 jours
    postgresMajorVersion: "17"  # version testée en local
    databaseName: kyro
    user: kyro

# ------------------------------------------------------------
#  À SAVOIR (plan gratuit Render)
#  1. La base PostgreSQL « free » expire après 90 jours → penser à
#     exporter ou upgrader avant, sous peine de perdre les données.
#  2. Le système de fichiers est ÉPHÉMÈRE : les images/vidéos
#     générées dans ./media sont perdues à chaque redéploiement.
#     Solutions : plan Starter + disque persistant, ou stockage
#     externe (S3 / Cloudinary / R2).
#  3. Le service gratuit se met en veille après ~15 min d'inactivité
#     (premier chargement lent, puis OK).
#  4. Toute modification de ce fichier se synchronise automatiquement.
# ------------------------------------------------------------
