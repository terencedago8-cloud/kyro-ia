# ============================================================
#  KYRO AI — Render Blueprint
#  Lu automatiquement par Render ("New +" → Blueprint).
#  Il crée : 1 service web (Python) + 1 base PostgreSQL managée.
#
#  Règle Render : les bases PostgreSQL sont déclarées au NIVEAU
#  RACINE (clé `databases`), jamais imbriquées dans un service.
# ============================================================

services:
  - type: web
    name: kyro-ai
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Render impose son propre PORT : on ne doit PAS forcer 8000.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KYRO_ENVIRONMENT
        value: production
      # Secret de signature des jetons JWT — généré aléatoirement par Render.
      - key: KYRO_JWT_SECRET
        generateValue: true
      # URL de la base PostgreSQL créée ci-dessous (propriété connectionString).
      - key: KYRO_DATABASE_URL
        fromDatabase:
          name: kyro-db
          property: connectionString
      # Restreint aux requêtes venant de l'URL publique du site.
      - key: KYRO_CORS_ORIGINS
        value: https://kyro-ai-gkvt.onrender.com
      # --- Fournisseurs IA ---
      # Par défaut, chat / code / images fonctionnent SANS AUCUNE CLÉ grâce au
      # repli gratuit Pollinations (IA réelle générée, jamais simulée).
      # Débit limité : ~1 texte/30 s et ~1 image/45 s PAR IP serveur (donc partagé
      # entre les visiteurs). La vidéo n'a aucun service gratuit : elle exige une clé.
      - key: KYRO_FREE_AI
        value: "true"
      # Pour lever les limites de débit ET activer la vidéo, une seule clé gratuite
      # suffit (https://enter.pollinations.ai/keys) — Environment du dashboard :
      #   KYRO_POLLINATIONS_KEY=sk_...
      # Ou votre propre fournisseur, qui prend la priorité :
      #   KYRO_CHAT_API_BASE / KYRO_CHAT_API_KEY / KYRO_CHAT_MODEL
      #   KYRO_IMAGE_API_BASE / KYRO_IMAGE_API_KEY / KYRO_IMAGE_MODEL
      #   KYRO_VIDEO_API_KEY (Replicate « r8_… ») / KYRO_VIDEO_MODEL
      # Sans clé vidéo, l'API répond 503 avec un message explicatif, SANS débiter.
      #
      # Le compte administrateur est créé au PREMIER démarrage seulement, à partir
      # des variables serveur ADMIN_EMAIL / ADMIN_USERNAME / ADMIN_PASSWORD.
      # Une fois créé, ces variables ne sont plus nécessaires (et ne sont donc pas
      # répétées ici : aucun secret dans le dépôt ni dans le Blueprint).

# Base PostgreSQL managée (déclaration de premier niveau — obligatoire)
databases:
  - name: kyro-db
    plan: free                # 0,1 CPU / 256 Mo — expire après 90 jours
    postgresMajorVersion: "17"  # version testée en local
    databaseName: kyro
    user: kyro

# ------------------------------------------------------------
#  À SAVOIR (plan gratuit Render)
#  1. La base PostgreSQL « free » expire après 90 jours → penser à
#     exporter ou upgrader avant, sous peine de perdre les données.
#  2. Le système de fichiers est ÉPHÉMÈRE : les images/vidéos
#     générées dans ./media sont perdues à chaque redéploiement.
#     Solutions : plan Starter + disque persistant, ou stockage
#     externe (S3 / Cloudinary / R2).
#  3. Le service gratuit se met en veille après ~15 min d'inactivité
#     (premier chargement lent, puis OK).
#  4. Toute modification de ce fichier se synchronise automatiquement.
# ------------------------------------------------------------
