version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kyro
      POSTGRES_PASSWORD: kyro
      POSTGRES_DB: kyro
    volumes:
      - kyro_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyro"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      KYRO_DATABASE_URL: postgresql+psycopg://kyro:kyro@db:5432/kyro
    volumes:
      - ./media:/app/media
    ports:
      - "8000:8000"

volumes:
  kyro_pgdata:
